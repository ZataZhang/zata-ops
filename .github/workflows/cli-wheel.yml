name: CLI wheel

on:
  pull_request:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}
      - name: Build wheel
        run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - name: Install and verify outside the checkout
        run: |
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/cli-wheel.XXXXXX")"
          cd "$smoke_dir"
          uv venv .venv
          uv pip install --python .venv/bin/python "$RUNNER_TEMP"/dist/*.whl
          uv pip check --python .venv/bin/python
          .venv/bin/python "$GITHUB_WORKSPACE/tests/smoke_cli_wheel.py"
      - name: Save verified wheel
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zata-ops-wheel
          path: ${{ runner.temp }}/dist/*.whl
          if-no-files-found: error
