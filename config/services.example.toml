# Metadata only. Store real credentials in ignored config/private/secrets.env.
# Use just service-add to register a real service interactively.
schema_version = 1

[[services]]
name = "main-postgres"
server = "example-server"
type = "postgresql"
host = "10.0.0.10"
port = 5432
database = "app"
username = "app_user"
url = ""
password_env = "MAIN_POSTGRES_PASSWORD"
notes = "Example database; no passwords or credential-bearing URLs here."
scope = ""
created_at = "2026-01-01"
expires_at = ""

[[services]]
name = "grafana-agent-reader"
server = "example-server"
type = "http"
host = "grafana.example.com"
port = 443
database = ""
username = "agent-log-reader"
url = "https://grafana.example.com"
password_env = "GRAFANA_EXAMPLE_VIEWER_TOKEN"
notes = "Example API token for agent log queries; rotate under Grafana service accounts."
scope = "Viewer"
created_at = "2026-01-01"
expires_at = "2026-04-01"
