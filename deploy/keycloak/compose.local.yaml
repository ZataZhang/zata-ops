name: zata-ops-keycloak-local

# 本机开发用：与线上相同的镜像和 realm 模板，开发模式内置数据库，重启后数据保留在容器内。
# Keycloak 共用 Mailpit 的网络命名空间：不新建 Docker 网络，SMTP 走 localhost:1025。
# 只绑回环地址；管理员与 client 密钥是固定的开发值，切勿用于任何共享环境。
# 启动与初始化见 `just keycloak-local`。

services:
  mailpit:
    image: axllent/mailpit:v1.21
    network_mode: bridge
    ports:
      - "127.0.0.1:${KC_LOCAL_PORT:-18280}:8080"
      - "127.0.0.1:${KC_LOCAL_MAIL_PORT:-18025}:8025"

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        KC_VERSION: ${KC_VERSION:-26.8.2}
    image: zata-ops-keycloak:local
    command: ["start-dev", "--import-realm"]
    network_mode: "service:mailpit"
    depends_on:
      - mailpit
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_REALM: dewell-local
      KC_REALM_DISPLAY_NAME: dewell local
      KC_SPI_ADMIN__ALLOWED_SYSTEM_VARIABLES: KC_REALM,KC_REALM_DISPLAY_NAME
      KC_SHARED_OTP_HMAC_SECRET: local-dev-only-otp-hmac-secret-0123456789
    volumes:
      - ./realm/realm.json:/opt/keycloak/data/import/dewell-local-realm.json:ro
      - ./realm/user-profile.json:/opt/keycloak/data/user-profile.json:ro
