name: zata-ops-keycloak

# 普通 VPS 版：复用宿主机已有的 Traefik 与 external `traefik` 网络。
# Dokploy 管理 80/443 的主机改用 compose.dokploy.yaml。

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  keycloak-db:
    <<: *runtime
    image: postgres:${KC_POSTGRES_VERSION:-17.11}
    container_name: zata-ops-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in .env}
    # 只绑回环地址，供宿主机上的 zata-ops db backup 或 SSH 隧道使用，不对外开放。
    ports:
      - "127.0.0.1:${KC_DB_LOCAL_PORT:-15432}:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    <<: *runtime
    build:
      context: .
      dockerfile: Dockerfile
      args:
        KC_VERSION: ${KC_VERSION:-26.8.2}
    image: zata-ops-keycloak:${KC_VERSION:-26.8.2}
    container_name: zata-ops-keycloak
    # realm 已存在时导入会被跳过，因此 realm/realm.json 只用于首次创建和从零重建。
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in .env}
      KC_HOSTNAME: https://${KC_PUBLIC_HOST:?Set KC_PUBLIC_HOST in .env}
      # 管理后台不经过 Traefik，只能经 SSH 隧道访问这个回环地址。
      KC_HOSTNAME_ADMIN: http://127.0.0.1:${KC_ADMIN_LOCAL_PORT:-18180}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # 单节点部署：关闭集群缓存，否则重启时会先尝试加入数据库里登记的旧节点。
      KC_CACHE: local
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Set KC_BOOTSTRAP_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      KC_REALM: ${KC_REALM:?Set KC_REALM in .env}
      KC_SPI_ADMIN__ALLOWED_SYSTEM_VARIABLES: KC_REALM,KC_REALM_DISPLAY_NAME
      # 登录页标题，不填时与 realm 名相同。
      KC_REALM_DISPLAY_NAME: ${KC_REALM_DISPLAY_NAME:-${KC_REALM}}
      KC_SHARED_OTP_HMAC_SECRET: ${KC_SHARED_OTP_HMAC_SECRET:?Set KC_SHARED_OTP_HMAC_SECRET in .env}
      KC_OTP_SMS_ACCESS_KEY_ID: ${KC_OTP_SMS_ACCESS_KEY_ID:-}
      KC_OTP_SMS_ACCESS_KEY_SECRET: ${KC_OTP_SMS_ACCESS_KEY_SECRET:-}
      KC_OTP_SMS_SIGN_NAME: ${KC_OTP_SMS_SIGN_NAME:-}
      KC_OTP_SMS_TEMPLATE_CODE: ${KC_OTP_SMS_TEMPLATE_CODE:-}
      KC_OTP_SMS_ENDPOINT: ${KC_OTP_SMS_ENDPOINT:-dypnsapi.aliyuncs.com}
      KC_OTP_SMS_PROTOCOL: ${KC_OTP_SMS_PROTOCOL:-https}
    ports:
      - "127.0.0.1:${KC_ADMIN_LOCAL_PORT:-18180}:8080"
    volumes:
      # Keycloak 要求导入文件名为 <realm>-realm.json，因此按 KC_REALM 命名挂载目标。
      - ./realm/realm.json:/opt/keycloak/data/import/${KC_REALM:?Set KC_REALM in .env}-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - keycloak-internal
      - traefik
    healthcheck:
      # 镜像不带 curl，用 bash 的 /dev/tcp 访问管理端口 9000 的就绪检查；只认 200，
      # 未就绪时返回 503，响应体里子检查项也会出现 "UP"，不能按内容判断。
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.zauth-http.entrypoints: web
      traefik.http.routers.zauth-http.rule: "Host(`${KC_PUBLIC_HOST}`)"
      traefik.http.routers.zauth-http.middlewares: zauth-https-redirect
      traefik.http.routers.zauth-http.service: zauth
      # 公网只放行业务 realm 与静态资源；master realm、/admin/、管理端口 9000 均不经过代理。
      traefik.http.routers.zauth.entrypoints: websecure
      traefik.http.routers.zauth.rule: "Host(`${KC_PUBLIC_HOST}`) && (PathPrefix(`/realms/${KC_REALM:?Set KC_REALM in .env}/`) || PathPrefix(`/resources/`))"
      traefik.http.routers.zauth.tls: "true"
      traefik.http.routers.zauth.tls.certresolver: letsencrypt
      traefik.http.routers.zauth.service: zauth
      traefik.http.services.zauth.loadbalancer.server.port: "8080"
      traefik.http.middlewares.zauth-https-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.zauth-https-redirect.redirectscheme.permanent: "true"

volumes:
  keycloak-db-data:
    name: ${KC_DB_VOLUME:-zata-ops-keycloak-db-data}

networks:
  # 不设 internal：internal 网络上的容器无法发布端口，回环绑定会失效。
  keycloak-internal:
  traefik:
    external: true
    name: traefik
