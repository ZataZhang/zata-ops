# -----------------------------------------------------------------------------
# Docker Compose（Dokploy 版，仅日志）— Vector + Loki + Grafana
# -----------------------------------------------------------------------------
# 用于已由 Dokploy 管理 80/443 的主机，复用 Dokploy 自带的 Traefik，不另起 Traefik。
# 与 docker-compose.yml 的差异：
#   - 外部网络为 dokploy-network；
#   - 写入口 Basic Auth 由 Docker label 定义，不依赖宿主机 Traefik 动态配置目录，
#     也不写入 /etc/dokploy/traefik/dynamic，避免影响 Dokploy 自身路由；
#   - 路由与中间件名加 zmon- 前缀，避免与同机 Dokploy 应用重名；
#   - 只部署日志链路，不含 Prometheus；需要指标时另行接入，本机 Vector 只加载 vector.yaml。
#
# Dokploy 中创建 Compose 应用：Provider 选 Git（本仓库），Compose Path 填
# deploy/monitoring/docker-compose.dokploy.yml；相对路径挂载依赖仓库检出目录。
# 不支持 Raw 来源：Raw 只有单个 compose 文件，相对路径配置会被 Docker 建成空目录。
# 不要开启 Isolated Deployment，否则网络会被改写。变量见 .env.dokploy.example。
# -----------------------------------------------------------------------------

x-runtime: &runtime
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  vector:
    <<: *runtime
    image: timberio/vector:0.58.0-debian
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/var/lib/vector
    environment:
      # 仅加载管理员管理的环境配置；本机采集走内部网络，不经过公网写入口。
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      NODE_NAME: ${NODE_NAME:?Set NODE_NAME}
      LOKI_ENDPOINT: http://loki:3100
      INGEST_USER: internal
      INGEST_PASSWORD: internal
    mem_limit: 256m
    cpus: 0.5
    networks:
      - monitoring
    restart: unless-stopped

  loki:
    <<: *runtime
    image: grafana/loki:3.7.7
    mem_limit: 2g
    cpus: 1.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - monitoring
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # 写入身份为逗号分隔的 user:{SHA}hash 列表，生成方式见 .env.dokploy.example。
      - "traefik.http.middlewares.zmon-ingest-auth.basicauth.users=${INGEST_BASIC_AUTH_USERS:?Set INGEST_BASIC_AUTH_USERS}"
      - "traefik.http.routers.zmon-logs-ingest.rule=Host(`${MONITORING_HOST:?Set MONITORING_HOST}`) && Path(`/loki/api/v1/push`)"
      - "traefik.http.routers.zmon-logs-ingest.entrypoints=websecure"
      - "traefik.http.routers.zmon-logs-ingest.tls.certresolver=letsencrypt"
      - "traefik.http.routers.zmon-logs-ingest.middlewares=zmon-ingest-auth@docker"
      - "traefik.http.routers.zmon-logs-ingest.service=zmon-logs-ingest"
      - "traefik.http.services.zmon-logs-ingest.loadbalancer.server.port=3100"
    restart: unless-stopped


  grafana:
    <<: *runtime
    image: grafana/grafana:13.2.1
    mem_limit: 768m
    cpus: 0.75
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set a strong Grafana password}
      GF_SERVER_ROOT_URL: https://${MONITORING_HOST:?Set MONITORING_HOST}
    volumes:
      - ./grafana/provisioning/datasources/loki.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
      - ./grafana/provisioning/dashboards/default.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./grafana/dashboards/logs-dashboard.json:/var/lib/grafana/dashboards/logs-dashboard.json:ro
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
      - dokploy-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.middlewares.zmon-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.zmon-grafana-web.rule=Host(`${MONITORING_HOST:?Set MONITORING_HOST}`)"
      - "traefik.http.routers.zmon-grafana-web.entrypoints=web"
      - "traefik.http.routers.zmon-grafana-web.middlewares=zmon-https-redirect@docker"
      - "traefik.http.routers.zmon-grafana-web.service=zmon-grafana"
      - "traefik.http.routers.zmon-grafana.rule=Host(`${MONITORING_HOST:?Set MONITORING_HOST}`)"
      - "traefik.http.routers.zmon-grafana.entrypoints=websecure"
      - "traefik.http.routers.zmon-grafana.tls=true"
      - "traefik.http.routers.zmon-grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.zmon-grafana.service=zmon-grafana"
      - "traefik.http.services.zmon-grafana.loadbalancer.server.port=3000"

volumes:
  vector-data:
  loki-data:
  grafana-data:

networks:
  monitoring:
    internal: true
  dokploy-network:
    external: true
