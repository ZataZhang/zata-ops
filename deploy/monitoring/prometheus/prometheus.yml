# -----------------------------------------------------------------------------
# Prometheus scrape configuration.
# -----------------------------------------------------------------------------

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 主机指标由各服务器 Vector 通过 remote_write 推送。
  # 应用指标需按实际部署另行配置，不能保留模板项目抓取地址。
