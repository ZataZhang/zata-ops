# -----------------------------------------------------------------------------
# Vector configuration: collect Docker container logs and forward to Loki.
# -----------------------------------------------------------------------------
# The `docker_logs` source reads stdout/stderr from all running containers via
# the Docker API. The JSON parser extracts structured fields emitted by the
# application; low-cardinality labels are attached before shipping to Loki.
# -----------------------------------------------------------------------------

data_dir: /var/lib/vector

sources:
  docker_logs:
    type: docker_logs
    docker_host: unix:///var/run/docker.sock
    exclude_containers: ["monitoring-vector", "observability-vector"]
  host_metrics:
    type: host_metrics
    scrape_interval_secs: 30
    collectors: [cpu, memory, load, disk, network, host]
  internal_metrics:
    type: internal_metrics

transforms:
  parse_app_json:
    type: remap
    inputs: ["docker_logs"]
    source: |
      # 保留 Docker 元数据，应用字段嵌套存放，避免覆盖服务标签。
      .node = "${NODE_NAME}"
      .compose_project = string(.label."com.docker.compose.project") ?? "unknown"
      .compose_service = string(.label."com.docker.compose.service") ?? "unknown"
      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        .app = parsed
        .level = downcase(string(parsed.level) ?? "info")
      } else {
        .level = "info"
      }
      .service_name = .compose_service
  tag_metrics:
    type: remap
    inputs: [host_metrics, internal_metrics]
    source: |
      .tags.node = "${NODE_NAME}"

sinks:
  loki:
    type: loki
    inputs: ["parse_app_json"]
    endpoint: ${LOKI_ENDPOINT}
    auth:
      strategy: basic
      user: ${INGEST_USER}
      password: ${INGEST_PASSWORD}
    # 公网只开放写入路径，连通性以实际写入和查询证据验证。
    healthcheck:
      enabled: false
    encoding:
      codec: json
    labels:
      node: "{{ node }}"
      compose_project: "{{ compose_project }}"
      compose_service: "{{ compose_service }}"
      service_name: "{{ service_name }}"
      level: "{{ level }}"
    out_of_order_action: accept
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
  prometheus:
    type: prometheus_remote_write
    inputs: [tag_metrics]
    endpoint: ${METRICS_ENDPOINT}
    auth:
      strategy: basic
      user: ${INGEST_USER}
      password: ${INGEST_PASSWORD}
    healthcheck:
      enabled: false
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
