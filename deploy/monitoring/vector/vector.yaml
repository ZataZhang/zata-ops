# -----------------------------------------------------------------------------
# Vector configuration: collect Docker container logs and forward to Loki.
# 主机指标在 vector-metrics.yaml，需要指标时以第二个 --config 一并加载。
# -----------------------------------------------------------------------------
# The `docker_logs` source reads stdout/stderr from all running containers via
# the Docker API. The JSON parser extracts structured fields emitted by the
# application; low-cardinality labels are attached before shipping to Loki.
# -----------------------------------------------------------------------------

data_dir: /var/lib/vector

sources:
  docker_logs:
    type: docker_logs
    docker_host: unix:///var/run/docker.sock
    exclude_containers: ["monitoring-vector", "observability-vector"]

transforms:
  parse_app_json:
    type: remap
    inputs: ["docker_logs"]
    source: |
      # 采集器自身日志按镜像丢弃；容器名随 Compose/Dokploy 项目名变化，不能只靠名称前缀排除。
      if starts_with(string(.image) ?? "", "timberio/vector") {
        abort
      }
      # 保留 Docker 元数据，应用字段嵌套存放，避免覆盖服务标签。
      .node = "${NODE_NAME}"
      .compose_project = string(.label."com.docker.compose.project") ?? "unknown"
      .compose_service = string(.label."com.docker.compose.service") ?? "unknown"
      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        .app = parsed
        .level = downcase(string(parsed.level) ?? "info")
      } else {
        .level = "info"
      }
      .service_name = .compose_service

sinks:
  loki:
    type: loki
    inputs: ["parse_app_json"]
    endpoint: ${LOKI_ENDPOINT}
    auth:
      strategy: basic
      user: ${INGEST_USER}
      password: ${INGEST_PASSWORD}
    # 公网只开放写入路径，连通性以实际写入和查询证据验证。
    healthcheck:
      enabled: false
    encoding:
      codec: json
    labels:
      node: "{{ node }}"
      compose_project: "{{ compose_project }}"
      compose_service: "{{ compose_service }}"
      service_name: "{{ service_name }}"
      level: "{{ level }}"
    out_of_order_action: accept
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
