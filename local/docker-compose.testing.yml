# -----------------------------------------------------------------------------
# Docker Compose — Local Testing Middleware
# -----------------------------------------------------------------------------
# 独立于项目的本地测试中间件，用于模拟外部服务。
# 仅用于本地开发和测试，密码明文写入，不要用于生产环境。
#
# Usage:
#   docker compose -f local/docker-compose.testing.yml up -d    # 或 just testing up
#   docker compose -f local/docker-compose.testing.yml down
#
# Connection strings for .env:
#   DATABASE_URL=postgresql+psycopg2://testuser:testpass@localhost:5432/testdb
#   DATABASE_MYSQL_URL=mysql+pymysql://testuser:testpass@localhost:3306/testdb
#   REDIS_URL=redis://:redis123@localhost:6379/0
#   S3_ENDPOINT=http://localhost:9000
#   S3_ACCESS_KEY=minioadmin
#   S3_SECRET_KEY=minioadmin
#   S3_BUCKET=app-backups
#   QDRANT_URL=http://localhost:6333
#   RAGFLOW_BASE_URL=http://localhost:9380
#   RAGFLOW_API_KEY=test-ragflow-key
#   OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://localhost:4318/v1/traces
#
# MinIO 启动后需手动创建 bucket（Console: http://localhost:9001，minioadmin/minioadmin）
# Jaeger Web UI: http://localhost:16686（Run / agent tracing 的本地 OTLP 接收端）
# 沙箱出站代理：下游项目 config.toml 的 [sandbox_agent.egress] 指向 sandbox-egress-proxy
# 服务，详见该服务注释与 deploy/sandbox/egress-proxy/squid.conf
# -----------------------------------------------------------------------------

# 固定 Compose 项目名。默认项目名取自 compose 文件所在目录，本文件在 local/ 下，
# 不固定就会变成 local，卷名前缀随之改变，现有的 zata-ops_* 卷会像"丢失"一样被换掉。
name: zata-ops


services:
  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible Object Storage
  # ---------------------------------------------------------------------------
  # 用于本地测试 S3 备份 / 文件存储，无需连接 AWS S3。
  # Web Console: http://localhost:9001
  # API Endpoint: http://localhost:9000
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: test-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-test-data:/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis — In-memory Data Store
  # ---------------------------------------------------------------------------
  # 用于本地测试缓存 / 会话 / 任务队列。
  # CLI: redis-cli -h localhost -p 6379
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: test-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL 17
  # ---------------------------------------------------------------------------
  # 独立于主项目的测试数据库，避免污染开发库。
  # psql -h localhost -p 5432 -U testuser -d testdb
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: test-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MySQL 8 — App 通用测试数据库
  # ---------------------------------------------------------------------------
  # 独立于 RAGflow 内部依赖 mysql，给 app 本地测试使用。
  # mysql -h localhost -P 3306 -u testuser -ptestpass testdb
  # ---------------------------------------------------------------------------
  mysql-app:
    image: mysql:8.0
    container_name: test-mysql-app
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: testrootpass
      MYSQL_DATABASE: testdb
    volumes:
      - mysql-app-test-data:/var/lib/mysql
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Qdrant — Vector Database
  # ---------------------------------------------------------------------------
  # 用于本地测试向量检索 / RAG / 语义搜索。
  # REST API: http://localhost:6333
  # gRPC: localhost:6334
  # Dashboard: http://localhost:6333/dashboard
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: test-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-test-data:/qdrant/storage
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MySQL 8 — RAGflow 元数据后端（内部依赖）
  # ---------------------------------------------------------------------------
  # RAGflow 硬依赖：默认连 service name `mysql:3306`。
  # 只为 RAGflow 服务，端口不暴露给 app（app 不直连）。
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: test-ragflow-pass
      MYSQL_DATABASE: rag_flow
    volumes:
      - mysql-test-data:/var/lib/mysql
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Infinity — RAGflow 向量 / 全文检索后端（内部依赖）
  # ---------------------------------------------------------------------------
  # RAGflow 硬依赖：默认连 service name `infinity:9000`。
  # 只为 RAGflow 服务，端口不暴露给 app。
  # ---------------------------------------------------------------------------
  infinity:
    image: infiniflow/infinity:latest
    container_name: test-infinity
    volumes:
      - infinity-test-data:/var/lib/infinity
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # RAGflow — RAG Pipeline Service
  # ---------------------------------------------------------------------------
  # 用于本地测试 RAGflow 作为第二个检索引擎。
  # REST API: http://localhost:9380
  #
  # 适配说明（与生产 deploy/ragflow 差异）：
  #   - 明文 env，测试用 API key 直接 inline（生产请用 app.env + secrets）
  #   - 端口直接暴露到 localhost，不挂 external Traefik
  #   - 无 deploy.resources 限制
  #
  # 依赖（已在本 compose 内就绪）：
  #   - MySQL        → service `mysql`     （元数据）
  #   - Infinity     → service `infinity`  （向量 / BM25）
  #   - Redis        → service `redis`     （缓存）
  #   - MinIO        → service `minio`     （原始文件）
  # 启动顺序：mysql / infinity / redis / minio 先 up，RAGflow 会等它们就绪后初始化。
  # ---------------------------------------------------------------------------
  ragflow:
    image: infiniflow/ragflow:latest
    container_name: test-ragflow
    ports:
      - "9380:9380"
    environment:
      RAGFLOW_API_KEY: test-ragflow-key
    volumes:
      - ragflow-test-data:/ragflow/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Jaeger — OTLP Trace 接收端（Run / agent tracing）
  # ---------------------------------------------------------------------------
  # 模板项目的 Run 执行轨迹经 OTLP/HTTP 导出（OTEL_EXPORTER_OTLP_TRACES_ENDPOINT），
  # 生产指向阿里云 ARMS；本地开发指向本服务，无需云端依赖。
  # 内存存储，容器重启即清空——本地排障够用，不要当持久后端。
  # Web UI: http://localhost:16686
  # OTLP HTTP: http://localhost:4318/v1/traces（gRPC: localhost:4317）
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    container_name: test-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Squid — 沙箱出站代理（docker 档沙箱 allowlist 出网模式）
  # ---------------------------------------------------------------------------
  # 与 zata_code_template 的 deploy/sandbox/docker-compose.sandbox.yml 同源。容器名与
  # 网络名刻意不用 test-* 前缀，保持与模板默认配置一致——下游项目 config.toml 写
  #   proxy_url    = "http://zata-sandbox-egress-proxy:3128"
  #   network_name = "zata-sandbox-egress"
  # 即可指向本服务。本服务与项目仓库内的 sandbox overlay 二选一，不要同时启动
  # （同名网络会冲突）。
  # 放行清单是安全边界，见 deploy/sandbox/egress-proxy/squid.conf（与模板同源）。
  # 出站审计日志：docker exec zata-sandbox-egress-proxy cat /var/log/squid/access.log
  # ---------------------------------------------------------------------------
  sandbox-egress-proxy:
    image: ubuntu/squid:latest
    container_name: zata-sandbox-egress-proxy
    restart: unless-stopped
    volumes:
      # 相对路径按 compose 文件所在目录解析；本文件在 local/ 下，../ 才是仓库根。
      - ../deploy/sandbox/egress-proxy/squid.conf:/etc/squid/squid.conf:ro
      # 出站访问日志是审计凭据；squid 以 proxy 用户运行、写不了 /dev/stdout，
      # 因此落到卷里。
      - sandbox-egress-logs:/var/log/squid
    networks:
      # 同时接内部网络（收沙箱流量）与默认网络（出站到放行域名）。
      - sandbox-egress
      - default

volumes:
  minio-test-data:
  postgres-test-data:
  mysql-app-test-data:
  qdrant-test-data:
  ragflow-test-data:
  mysql-test-data:
  infinity-test-data:
  sandbox-egress-logs:

networks:
  sandbox-egress:
    name: zata-sandbox-egress
    # internal 让沙箱容器无法直连外网，只能经代理出站。
    # 这是"按域名放行"能成立的前提，不是可选优化。
    internal: true
    # 刻意不指定 subnet：宿主上通常已有多个 Docker 项目，固定网段会与它们冲突。
    # 由 Docker 自动分配，squid 侧用私有网段 ACL 兜底即可——网络本身是 internal，
    # 可达性已经受限。
