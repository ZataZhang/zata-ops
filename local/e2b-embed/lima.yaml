minimumLimaVersion: 2.0.0

vmType: vz
arch: aarch64
nestedVirtualization: true
cpus: 8
memory: 12GiB
disk: 40GiB

# Firecracker 主机设置限制在此虚拟机内；不挂载宿主目录。
mounts: []

images:
  - location: https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-arm64.img
    arch: aarch64
    variant: server

portForwards:
  - guestPort: 3000
    hostIP: 127.0.0.1
  - guestPort: 3001
    hostIP: 127.0.0.1
  - guestPort: 3002
    hostIP: 127.0.0.1

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y ca-certificates curl e2fsprogs iproute2 iptables rsync
      if ! command -v docker >/dev/null 2>&1; then
        curl -fsSL https://get.docker.com | sh
      fi
      systemctl enable --now docker
