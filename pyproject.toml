[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zata-ops"
version = "0.1.0"
description = "Operations toolkit CLI for Zata downstream projects (db backup/restore, S3 diagnostics, VPS provisioning, logs, dashboard)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.37.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.0",
    "questionary>=2.1.1",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
# 后端 FastAPI 应用依赖（来自 zata_code_template，仅源代码已迁移，alembic/settings 后续轮）。
backend = [
    "alembic>=1.18.4",
    "bcrypt>=4.1.0",
    "fastapi>=0.115.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "prometheus-client>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.0",
    "python-json-logger>=2.0.7",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
zata-ops = "zata_ops.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zata_ops.env.templates" = ["*.sh"]

[dependency-groups]
dev = [
    "fakeredis>=2.21.0",
    "mkdocs-git-revision-date-localized-plugin>=1.4.5",
    "mkdocs-material>=9.6.0",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=0.30.0",
    "moto>=5.0.0",
    "pre-commit>=4.5.1",
    "pylint>=3.2.0",
    "pymdown-extensions>=10.14",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.0",
    "pytest>=8.3.0",
    "ruff==0.7.4",
    "socksio>=1.0.0",
]
